<!DOCTYPE html>
<html lang="en-GB" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selcap Cloud Manager</title>
<style>
:root{
  --red:#b00020; --red-dark:#8a0019; --red-soft:#fbe9ec;
  --bg:#f3f2f1; --surface:#ffffff; --surface-2:#faf9f8;
  --border:#e1dfdd; --border-strong:#c8c6c4;
  --text:#201f1e; --text-2:#605e5c; --text-3:#8a8886;
  --green:#107c10; --amber:#c19c00; --blue:#0078d4;
  --shadow:0 1.6px 3.6px rgba(0,0,0,.08),0 .3px .9px rgba(0,0,0,.06);
  --shadow-lg:0 6.4px 14.4px rgba(0,0,0,.12),0 1.2px 3.6px rgba(0,0,0,.08);
  --radius:6px; --sidebar-w:248px;
  --font:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
}
[data-theme="dark"]{
  --bg:#1b1a19; --surface:#252423; --surface-2:#2d2c2b;
  --border:#3b3a39; --border-strong:#484644;
  --text:#f3f2f1; --text-2:#c8c6c4; --text-3:#979593;
  --red:#e74856; --red-dark:#c53340; --red-soft:#3a2226;
  --shadow:0 1.6px 3.6px rgba(0,0,0,.3);
  --shadow-lg:0 6.4px 14.4px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select{font-family:inherit;font-size:14px}
a{color:var(--red);text-decoration:none}
.hidden{display:none!important}

/* ---------- Login ---------- */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden}
.login-bg{position:absolute;inset:0;background-size:cover;background-position:center;z-index:0}
.login-bg:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(138,0,25,.88),rgba(176,0,32,.78) 55%,rgba(92,0,17,.9))}
[data-theme="dark"] .login-bg:after{background:linear-gradient(135deg,rgba(20,20,22,.9),rgba(40,10,16,.86) 55%,rgba(10,10,12,.94))}
.login-card{position:relative;z-index:1;background:var(--surface);border-radius:10px;box-shadow:var(--shadow-lg);width:100%;max-width:410px;padding:40px 36px}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:10px;min-height:40px}
.login-logo .mark{width:38px;height:38px;border-radius:7px;background:var(--red);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:20px}
.login-sub{color:var(--text-2);font-size:13px;margin-bottom:28px}
.ms-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:11px;border:1px solid var(--border-strong);border-radius:var(--radius);background:var(--surface);font-size:14px;font-weight:600;transition:background .15s}
.ms-btn:hover{background:var(--surface-2)}
.ms-logo{width:18px;height:18px;display:grid;grid-template-columns:1fr 1fr;gap:2px}
.ms-logo span{display:block}
.demo-note{margin-top:24px;padding-top:20px;border-top:1px solid var(--border);font-size:12px;color:var(--text-3)}
.demo-users{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.demo-users button{text-align:left;padding:8px 10px;border:1px solid var(--border);border-radius:var(--radius);font-size:12.5px;transition:.15s;background:var(--surface-2)}
.demo-users button:hover{border-color:var(--red);background:var(--red-soft)}
.demo-users b{color:var(--text)}
.demo-users .r{color:var(--text-3);font-size:11px}

/* ---------- Shell ---------- */
#app{display:none;min-height:100vh}
.topbar{height:48px;background:var(--red);color:#fff;display:flex;align-items:center;padding:0 16px;gap:14px;position:sticky;top:0;z-index:50}
.topbar .brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:15px}
.topbar .brand .mark{width:26px;height:26px;border-radius:6px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-weight:700}
.topbar .spacer{flex:1}
.topbar .company-pill{background:rgba(255,255,255,.15);padding:5px 12px;border-radius:20px;font-size:13px;display:flex;align-items:center;gap:7px;cursor:pointer}
.topbar .company-pill:hover{background:rgba(255,255,255,.25)}
.topbar .icon-btn{width:34px;height:34px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff}
.topbar .icon-btn:hover{background:rgba(255,255,255,.15)}
.topbar .avatar{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.layout{display:flex}
.sidebar{width:var(--sidebar-w);background:var(--surface);border-right:1px solid var(--border);height:calc(100vh - 48px);position:sticky;top:48px;overflow-y:auto;padding:10px 0;flex-shrink:0}
.nav-group-label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-3);padding:14px 20px 6px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:12px;padding:9px 20px;color:var(--text-2);font-size:14px;cursor:pointer;border-left:3px solid transparent}
.nav-item:hover{background:var(--surface-2);color:var(--text)}
.nav-item.active{background:var(--red-soft);color:var(--red);border-left-color:var(--red);font-weight:600}
.nav-item .ico{width:18px;text-align:center;flex-shrink:0}
.nav-item .badge{margin-left:auto;background:var(--red);color:#fff;font-size:11px;padding:1px 7px;border-radius:10px;font-weight:600}
.main{flex:1;padding:24px 28px;max-width:calc(100vw - var(--sidebar-w));overflow-x:hidden}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:20px;gap:16px;flex-wrap:wrap}
.page-head h2{font-size:22px;font-weight:600}
.page-head p{color:var(--text-2);font-size:13px;margin-top:2px}

/* ---------- Components ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.kpi-grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.kpi{padding:18px 20px}
.kpi .label{font-size:12.5px;color:var(--text-2);display:flex;align-items:center;gap:7px}
.kpi .ico{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.kpi .val{font-size:28px;font-weight:600;margin-top:8px;letter-spacing:-.5px}
.kpi .sub{font-size:12px;color:var(--text-3);margin-top:2px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:var(--radius);font-size:14px;font-weight:600;transition:.15s;border:1px solid transparent}
.btn-primary{background:var(--red);color:#fff}
.btn-primary:hover{background:var(--red-dark)}
.btn-ghost{background:var(--surface);border-color:var(--border-strong);color:var(--text)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-sm{padding:5px 11px;font-size:13px}
.btn-green{background:var(--green);color:#fff}
.btn-green:hover{filter:brightness(.92)}
.btn-danger{background:var(--surface);border-color:var(--red);color:var(--red)}
.btn-danger:hover{background:var(--red-soft)}

.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--border-strong);border-radius:var(--radius);background:var(--surface);color:var(--text)}
.search .ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-3)}
select.filter{padding:8px 12px;border:1px solid var(--border-strong);border-radius:var(--radius);background:var(--surface);color:var(--text)}

.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;padding:11px 14px;background:var(--surface-2);color:var(--text-2);font-weight:600;font-size:12.5px;border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
th:hover{color:var(--text)}
td{padding:11px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
.avatar-cell{display:flex;align-items:center;gap:10px}
.avatar-sm{width:30px;height:30px;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:11px;font-size:12px;font-weight:600}
.pill-green{background:rgba(16,124,16,.12);color:var(--green)}
.pill-red{background:var(--red-soft);color:var(--red)}
.pill-amber{background:rgba(193,156,0,.14);color:var(--amber)}
.pill-blue{background:rgba(0,120,212,.12);color:var(--blue)}
.pill-grey{background:var(--surface-2);color:var(--text-2);border:1px solid var(--border)}
.lic-basic{background:rgba(0,120,212,.1);color:var(--blue)}
.lic-standard{background:rgba(138,0,25,.1);color:var(--red)}
.lic-none{background:var(--surface-2);color:var(--text-3);border:1px solid var(--border)}

.row-actions{display:flex;gap:4px;opacity:.4;transition:.15s}
tr:hover .row-actions{opacity:1}
.icon-act{width:28px;height:28px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--text-2)}
.icon-act:hover{background:var(--red-soft);color:var(--red)}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:var(--surface);border-radius:8px;box-shadow:var(--shadow-lg);width:100%;max-width:640px;max-height:90vh;overflow-y:auto}
.modal.wide{max-width:820px}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);z-index:2}
.modal-head h3{font-size:18px;font-weight:600}
.modal-body{padding:24px}
.modal-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:10px;position:sticky;bottom:0;background:var(--surface)}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:var(--text)}
.field .req{color:var(--red)}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;border:1px solid var(--border-strong);border-radius:var(--radius);background:var(--surface);color:var(--text)}
.field textarea{resize:vertical;min-height:70px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field .hint{font-size:12px;color:var(--text-3);margin-top:4px}

/* Wizard */
.stepper{display:flex;gap:0;margin-bottom:24px;overflow-x:auto}
.step{display:flex;align-items:center;gap:8px;padding:0 14px;color:var(--text-3);font-size:13px;white-space:nowrap;position:relative}
.step .num{width:24px;height:24px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.step.active{color:var(--red);font-weight:600}
.step.active .num{background:var(--red);color:#fff;border-color:var(--red)}
.step.done .num{background:var(--green);color:#fff;border-color:var(--green)}
.check-list{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow-y:auto}
.check-item{display:flex;align-items:center;gap:11px;padding:11px 14px;border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:.15s}
.check-item:hover{background:var(--surface-2)}
.check-item.sel{border-color:var(--red);background:var(--red-soft)}
.check-item input{width:17px;height:17px;accent-color:var(--red)}
.check-item .desc{font-size:12px;color:var(--text-3)}
.lic-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.lic-card{border:2px solid var(--border);border-radius:8px;padding:18px;cursor:pointer;transition:.15s}
.lic-card:hover{border-color:var(--border-strong)}
.lic-card.sel{border-color:var(--red);background:var(--red-soft)}
.lic-card h4{font-size:15px;margin-bottom:4px}
.lic-card .price{font-size:24px;font-weight:600;color:var(--red);margin:8px 0}
.lic-card .price span{font-size:13px;color:var(--text-3);font-weight:400}
.lic-card ul{list-style:none;font-size:12.5px;color:var(--text-2);margin-top:8px}
.lic-card li{padding:2px 0;padding-left:18px;position:relative}
.lic-card li:before{content:"✓";position:absolute;left:0;color:var(--green)}
.review-box{background:var(--surface-2);border-radius:var(--radius);padding:16px 18px}
.review-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.review-row:last-child{border:none}
.review-row .k{color:var(--text-2)}
.review-row .v{font-weight:600;text-align:right}

/* Detail rows */
.detail-grid{display:grid;grid-template-columns:auto 1fr;gap:10px 20px;font-size:13.5px}
.detail-grid .k{color:var(--text-2)}
.credbox{background:var(--surface-2);border:1px dashed var(--red);border-radius:var(--radius);padding:16px;margin-top:8px}
.credbox .cred-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-family:'Consolas',monospace;font-size:14px}
.credbox .copy{font-size:12px;font-family:var(--font)}

/* Empty & toast */
.empty{text-align:center;padding:50px 20px;color:var(--text-3)}
.empty .ico{font-size:40px;margin-bottom:12px;opacity:.5}
#toast-wrap{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--green);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:13px 18px;min-width:280px;display:flex;gap:11px;align-items:flex-start;animation:slidein .3s}
.toast.err{border-left-color:var(--red)}
.toast.info{border-left-color:var(--blue)}
@keyframes slidein{from{transform:translateX(120%)}to{transform:translateX(0)}}
.toast .t-title{font-weight:600;font-size:13.5px}
.toast .t-msg{font-size:12.5px;color:var(--text-2)}

.section-title{font-size:16px;font-weight:600;margin:24px 0 12px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.activity-item{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);font-size:13px}
.activity-item:last-child{border:none}
.activity-item .dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex-shrink:0}
.activity-item .meta{color:var(--text-3);font-size:12px}
.chart-bar{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.chart-bar .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart-bar .bar{width:70%;background:var(--red);border-radius:4px 4px 0 0;min-height:4px;transition:.3s}
.chart-bar .bar-lbl{font-size:11px;color:var(--text-3)}

@media(max-width:820px){
  .sidebar{position:fixed;left:0;top:48px;z-index:40;transform:translateX(-100%);transition:.2s;box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:translateX(0)}
  .main{max-width:100vw;padding:16px}
  .field-row,.two-col,.lic-cards{grid-template-columns:1fr}
  .menu-toggle{display:flex!important}
}
.menu-toggle{display:none}
</style>
</head>

  <div class="login-card">

</div>

<!-- APP SHELL -->
<div id="app">

    <div class="spacer"></div>
    <div class="company-pill" id="companyPill" onclick="SCM.openCompanySwitch()"></div>
    <button class="icon-btn" onclick="SCM.toggleTheme()" title="Toggle theme" id="themeBtn">◐</button>
    <button class="icon-btn" title="Sign out" onclick="SCM.logout()">⏻</button>
    <div class="avatar" id="topAvatar"></div>
  </div>
  <div class="layout">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="main" id="main"></main>
  </div>
</div>

<div id="toast-wrap"></div>

<script>

const COMPANIES = {

  'Thinc Digital':     {domain:'thincdigital.co.uk', colour:'#00abef', logo:'thinc',    mgmtFee:250, supportFee:100},
};

// ---------- Roles / admins (seeded) ----------
// email -> {role, name, company, super?}
const ACCOUNTS = {
  'ajay@catoservices.com':      {name:'Ajay Kawa',    role:'super',   company:'Cato Services'},
  'peter@catoservices.com':     {name:'Peter Baldwin',role:'admin',   company:'Cato Services'},
  'kevin@homesitegroup.com':    {name:'Kevin Morrow', role:'admin',   company:'HomeSite Group'},
  'lee@yecmanagement.com':      {name:'Lee Allen',    role:'admin',   company:'YEC Management'},
  'raj@selcapgroup.com':        {name:'Raj Kumar',    role:'admin',   company:'SelCap Group'},
};
// Ajay is also admin for Chanlon, SelCap, Thinc — as super he sees all anyway.

// ---------- State ----------
let S = {
  user:null,            // current signed-in account
  activeCompany:null,   // company being viewed (super can switch)
  page:'dashboard',
  users:[],             // working copy of users
  requests:[],
  audit:[],
  sortKey:'name', sortDir:1,
  search:'', filterStatus:'all', filterLicence:'all',
};

// ---------- Persistence (localStorage disabled in artifact; in-memory) ----------
function seedData(){
  S.users = SEED_USERS.map((u,i)=>({id:'u'+i, ...u}));
  S.requests = SAMPLE_REQUESTS();
  S.audit = SAMPLE_AUDIT();
}

// ---------- Helpers ----------
const $ = s=>document.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const initials = n=>n.split(' ').filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();
const esc = s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = n=>'£'+n.toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
const today = ()=>new Date().toISOString().slice(0,10);
const now = ()=>new Date().toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
function colourFor(name){const c=name.split('').reduce((a,ch)=>a+ch.charCodeAt(0),0);const h=['#b00020','#0f6cbd','#107c10','#5c2d91','#c19c00','#008272','#e3008c','#ca5010'];return h[c%h.length];}

// visible users respecting company isolation
function visibleUsers(){
  const list = S.user.role==='super' ? S.users.filter(u=>u.company===S.activeCompany) : S.users.filter(u=>u.company===S.user.company);
  return list;
}
function companyUsers(name){return S.users.filter(u=>u.company===name);}

// ---------- Branding ----------
function applyLoginBrand(){
  const bg=$('#loginBg'); if(bg && window.ASSETS && ASSETS.bg2) bg.style.backgroundImage=`url(${ASSETS.bg2})`;
  const logo=$('#loginLogo'), fb=$('#loginLogoFallback');
  if(window.ASSETS && ASSETS.selcap){ logo.src=ASSETS.selcap; }
  else if(logo){ logo.classList.add('hidden'); if(fb)fb.classList.remove('hidden'); }
}
// Recolour top bar + active-company accents to the current company's brand
function applyCompanyBrand(){
  const name = S.activeCompany || (S.user&&S.user.company);
  const cfg = COMPANIES[name]; if(!cfg) return;
  const c = cfg.colour;
  const top=document.querySelector('.topbar'); if(top) top.style.background=c;
  const chip=$('#brandLogo');
  if(chip){
    if(cfg.logo && window.ASSETS && ASSETS[cfg.logo]){ chip.innerHTML=`<img src="${ASSETS[cfg.logo]}" alt="${esc(name)}" style="height:22px;max-width:140px;object-fit:contain;background:#fff;padding:2px 7px;border-radius:4px">`; }
    else { chip.innerHTML=`<span style="font-weight:600;color:#fff">${esc(name)}</span>`; }
  }
}

// ---------- Auth ----------
function buildDemoUsers(){
  const box=$('#demoUsers');
  const demos=[
    ['ajay@catoservices.com','Super Administrator — all companies'],
    ['kevin@homesitegroup.com','Company Admin — HomeSite Group'],
    ['lee@yecmanagement.com','Company Admin — YEC Management'],
    ['peter@catoservices.com','Company Admin — Cato Services'],
  ];
  demos.forEach(([email,desc])=>{
    const a=ACCOUNTS[email];
    const b=el('button',null,`<b>${a.name}</b><div class="r">${desc}</div>`);
    b.onclick=()=>doLogin(email);
    box.appendChild(b);
  });
}
// ---------- Real Microsoft sign-in (MSAL) ----------
let msalApp=null;
function initMsal(){
  if(msalApp||typeof msal==='undefined'||!window.MS_CONFIG||!MS_CONFIG.clientId.includes('-'))return;
  try{
    msalApp=new msal.PublicClientApplication({
      auth:{clientId:MS_CONFIG.clientId,authority:'https://login.microsoftonline.com/'+MS_CONFIG.tenantId,redirectUri:MS_CONFIG.redirectUri},
      cache:{cacheLocation:'sessionStorage'}
    });
  }catch(e){msalApp=null;}
}
function domainToCompany(email){
  const dom=(email.split('@')[1]||'').toLowerCase();
  for(const name in COMPANIES){ if(COMPANIES[name].domain===dom) return name; }
  if(dom.endsWith('onmicrosoft.com'))return 'Cato Services';
  return null;
}
// Decide role for a signed-in Microsoft user
function accountForEmail(email,displayName){
  const key=email.toLowerCase();
  if(ACCOUNTS[key]) return {...ACCOUNTS[key], email:key};      // known admin/super
  const company=domainToCompany(key);
  if(!company) return null;                                     // unknown domain -> blocked
  return {name:displayName||email, role:'readonly', company, email:key}; // default: read-only in own company
}
async function msLogin(){
  initMsal();
  if(!msalApp){
    toast('error','Sign-in not ready','The Microsoft library did not load. Check your connection, or use a demo profile below.');
    return;
  }
  try{
    const res=await msalApp.loginPopup({scopes:['User.Read'],prompt:'select_account'});
    const email=(res.account.username||'').toLowerCase();
    const name=res.account.name||email;
    const acc=accountForEmail(email,name);
    if(!acc){
      toast('error','No access','Your account ('+email+') is not linked to a managed company. Contact Selcap.');
      return;
    }
    loginWith(acc);
  }catch(e){
    if(e && e.errorCode==='user_cancelled')return;

// ---------- Toast ----------
function toast(type,title,msg){
  const t=el('div','toast '+(type==='error'?'err':type),
    `<div style="font-size:16px">${type==='error'?'⚠️':type==='info'?'ℹ️':'✅'}</div>
     <div><div class="t-title">${esc(title)}</div>${msg?`<div class="t-msg">${esc(msg)}</div>`:''}</div>`);
  $('#toast-wrap').appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='.3s';setTimeout(()=>t.remove(),300);},4200);
}

    </div></td></tr>`).join('');
  $('#userTable').innerHTML=`<div class="table-wrap"><table><thead><tr>
    ${th('name','User')}${th('department','Department')}${th('title','Job Title')}${th('license','Licence')}${th('status','Status')}${th('created','Created')}<th>Actions</th>

/* ============ Firestore data layer ============ */
(function(){
const S=SCM.S;
let db=null, ready=false;
let unsubReq=null, unsubAudit=null;

function init(){
  if(ready) return true;
  if(typeof firebase==='undefined' || !window.FIREBASE_CONFIG) return false;
  try{
    if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    db=firebase.firestore();
    ready=true;
    return true;
  }catch(e){ console.warn('Firestore init failed',e); return false; }
}

// Start live listeners once a user is signed in.
function start(){
  if(!init()){ SCM.toast('info','Offline mode','Using local data — cloud database not reachable.'); return; }
  // Requests: live, ordered by created time desc
  unsubReq = db.collection('requests').orderBy('createdAt','desc').onSnapshot(snap=>{
    S.requests = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(S.user) { SCM.renderNav(); if(['dashboard','requests'].includes(S.page)) SCM.go(S.page); }
  }, err=>console.warn('requests listener',err));
  // Audit: live
  unsubAudit = db.collection('audit').orderBy('createdAt','desc').limit(200).onSnapshot(snap=>{
    S.audit = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(S.user && S.page==='audit') SCM.go('audit');
  }, err=>console.warn('audit listener',err));
}
function stop(){ if(unsubReq)unsubReq(); if(unsubAudit)unsubAudit(); unsubReq=unsubAudit=null; }

// If Firestore is empty on first run, seed the sample requests/audit once.
async function seedIfEmpty(){
  if(!ready) return;
  try{
    const rq=await db.collection('requests').limit(1).get();
    if(rq.empty){
      for(const r of SAMPLE_REQUESTS()){ await addRequest(r,true); }
    }
  }catch(e){ console.warn('seed check failed',e); }
}

// ---- Writes ----
async function addRequest(r, keepId){
  if(!ready){ S.requests.unshift(r); return r; }
  const doc={...r, createdAt:firebase.firestore.FieldValue.serverTimestamp()};
  delete doc.id;
  try{ await db.collection('requests').add(doc); }catch(e){ console.warn('addRequest',e); S.requests.unshift(r); }
  return r;
}
async function updateRequest(id, patch){
  if(!ready || !id || id.startsWith('r1')||id.startsWith('r2')||id.startsWith('r3')||id.startsWith('r4')||id.startsWith('r5')||id.startsWith('r6')){
    // local sample ids or offline — patch in memory
    const r=S.requests.find(x=>x.id===id); if(r)Object.assign(r,patch); return;
  }
  try{ await db.collection('requests').doc(id).update(patch); }
  catch(e){ console.warn('updateRequest',e); const r=S.requests.find(x=>x.id===id); if(r)Object.assign(r,patch); }
}
async function addAudit(entry){
  if(!ready){ S.audit.unshift(entry); return; }
  const doc={...entry, createdAt:firebase.firestore.FieldValue.serverTimestamp()};
  delete doc.id;
  try{ await db.collection('audit').add(doc); }catch(e){ console.warn('addAudit',e); S.audit.unshift(entry); }
}

SCM.DB={init,start,stop,seedIfEmpty,addRequest,updateRequest,addAudit,isReady:()=>ready};
})();

function approveRequest(id){
  const r=S.requests.find(x=>x.id===id);if(!r)return;
  setStatus(r,{status:'Approved'});
  // Simulate Graph execution
  if(r.type==='New User'){
    const pw=genPassword();
    const p=r.payload||{};
    const newUser={id:'u'+Date.now(),name:r.target,email:p.email||(r.target.toLowerCase().replace(/ /g,'.')+'@'+C[r.company].domain),
      domain:C[r.company].domain,company:r.company,title:p.title||'',department:p.dept||'',office:p.office||'',mobile:p.mobile||'',
      created:today(),license:r.licence,status:'Active'};
    S.users.unshift(newUser);
    SCM.audit('Created user '+r.target,'—',newUser.email,'201 Created');
    showCredentials(r.target,newUser.email,pw);
  } else if(r.type==='Password Reset'){
    const pw=genPassword();
    SCM.audit('Reset password for '+r.target,'—','Temp password issued','200 OK');
    showCredentials(r.target,'(existing account)',pw);
  } else if(r.type.startsWith('Offboard')||r.type==='Disable User'){
    const u=S.users.find(x=>x.name===r.target&&x.company===r.company);if(u)u.status='Disabled';
    SCM.audit(r.type+' '+r.target,'Active','Disabled','204 No Content');
    SCM.closeModal();SCM.toast('success','Done','Microsoft 365 updated. '+r.target+' disabled.');
  } else {
    SCM.audit('Approved '+r.type+' — '+r.target,'Pending','Approved','200 OK');
    SCM.closeModal();SCM.toast('success','Approved','Microsoft 365 updated via Graph.');
  }
  SCM.renderNav();
  if(['requests','dashboard','users','audit'].includes(S.page))SCM.go(S.page);
}

function requestReset(id){
  const u=S.users.find(x=>x.id===id);if(!u)return;
  const req={id:'r'+Date.now(),type:'Password Reset',company:u.company,target:u.name,by:S.user.name,date:now(),status:'Pending',licence:'—',comments:'Password reset requested'};
  pushRequest(req);SCM.audit('Submitted request: Password Reset — '+u.name,'—','Pending');
  SCM.closeModal();SCM.toast('success','Reset requested',S.user.role==='super'?'Approve in Request Centre.':'Selcap will process the reset.');SCM.renderNav();
  if(S.page==='requests')SCM.go('requests');
}
function toggleUser(id){
  const u=S.users.find(x=>x.id===id);if(!u)return;
  const act=u.status==='Active'?'Disable User':'Enable User';
  const req={id:'r'+Date.now(),type:act,company:u.company,target:u.name,by:S.user.name,date:now(),status:'Pending',licence:'—',comments:''};
  pushRequest(req);SCM.audit('Submitted request: '+act+' — '+u.name,'—','Pending');
  SCM.toast('success','Request submitted',act+' request for '+u.name+' sent for approval.');SCM.renderNav();
  if(S.page==='requests')SCM.go('requests');
}

/* ---------- table helpers ---------- */
function userSearch(v){S.search=v;SCM.renderUserTable();}
function setFilter(k,v){S[k]=v;SCM.renderUserTable();}
function sortUsers(k){if(S.sortKey===k)S.sortDir*=-1;else{S.sortKey=k;S.sortDir=1;}SCM.renderUserTable();}
function exportUsers(){
  const list=SCM.visibleUsers();
  const rows=[['Name','Email','Department','Title','Licence','Status','Created']];
  list.forEach(u=>rows.push([u.name,u.email,u.department,u.title,u.license,u.status,u.created]));
  const csv=rows.map(r=>r.map(c=>`"${(c||'').toString().replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=activeCompanyName().replace(/ /g,'_')+'_users.csv';a.click();
  SCM.toast('success','Exported',list.length+' users exported to CSV.');
}

Object.assign(SCM,{
  startNewUser,renderWizard,wizSet,wizToggle,wizRefresh,wizNext,wizBack,wizSubmit,
  startOffboard,submitOffboard,reviewRequest,approveRequest,rejectRequest,showCredentials,copyText,
  viewUser,requestReset,toggleUser,userSearch,setFilter,sortUsers,exportUsers
});
})();
